name: Final storage verification
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test bucket routing again
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "routing verification" > /tmp/test.txt
          OK_COUNT=0
          FAIL_COUNT=0
          for PAIR in "CHEMISTRY:chemistry" "BIOLOGY:biology" "NOTASUBJECT:new-files"; do
            SUBJECT="${PAIR%%:*}"
            BUCKET="${PAIR##*:}"
            PATH_IN_BUCKET="verify2/check-${SUBJECT}.txt"
            SIGN_RESULT=$(curl -s -X POST \
              "$SUPABASE_URL/storage/v1/object/upload/sign/$BUCKET/$PATH_IN_BUCKET" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" -d '{}')
            TOKEN=$(echo "$SIGN_RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);const u=new URL('http://x'+j.url);console.log(u.searchParams.get('token')||'');}catch(e){console.log('');}})")
            if [ -z "$TOKEN" ]; then
              echo "[$SUBJECT] SIGN FAILED for bucket=$BUCKET"
              FAIL_COUNT=$((FAIL_COUNT+1))
              continue
            fi
            curl -s -o /dev/null -X PUT "$SUPABASE_URL/storage/v1/object/upload/sign/$BUCKET/$PATH_IN_BUCKET?token=$TOKEN" -F "cacheControl=3600" -F "=@/tmp/test.txt"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/storage/v1/object/public/$BUCKET/$PATH_IN_BUCKET")
            if [ "$CODE" = "200" ]; then
              echo "[$SUBJECT] OK -> bucket=$BUCKET"
              OK_COUNT=$((OK_COUNT+1))
            else
              echo "[$SUBJECT] FAILED -> bucket=$BUCKET http=$CODE"
              FAIL_COUNT=$((FAIL_COUNT+1))
            fi
            curl -s -o /dev/null -X DELETE "$SUPABASE_URL/storage/v1/object/$BUCKET/$PATH_IN_BUCKET" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"
          done
          echo "::notice::ROUTING_TEST: ok=$OK_COUNT failed=$FAIL_COUNT"

      - name: Check all 12 already-uploaded Chemistry files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          FILES=(
            "chapter-01-states-of-matter.pdf:17131532"
            "chapter-02-atoms-elements-compounds.pdf:27900399"
            "chapter-03-stoichiometry.pdf:16446127"
            "chapter-04-electrochemistry.pdf:19391603"
            "chapter-05-chemical-energetics.pdf:3141639"
            "chapter-06-chemical-reactions.pdf:20003848"
            "chapter-07-acids-bases-salts.pdf:14315107"
            "chapter-08-periodic-table.pdf:22730263"
            "chapter-09-metals.pdf:46392491"
            "chapter-10-chemistry-of-the-environment.pdf:42436693"
            "chapter-11-organic-chemistry.pdf:41723893"
            "chapter-12-experimental-techniques.pdf:12390171"
          )
          OK=0
          FAIL=0
          for ENTRY in "${FILES[@]}"; do
            NAME="${ENTRY%%:*}"
            EXPECTED_SIZE="${ENTRY##*:}"
            URL="$SUPABASE_URL/storage/v1/object/public/new-files/chemistry/notes/$NAME"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            SIZE=$(curl -s -o /dev/null -w "%{size_download}" "$URL")
            if [ "$CODE" = "200" ] && [ "$SIZE" = "$EXPECTED_SIZE" ]; then
              echo "[OK] $NAME size=$SIZE"
              OK=$((OK+1))
            else
              echo "[FAIL] $NAME http=$CODE size=$SIZE expected=$EXPECTED_SIZE"
              FAIL=$((FAIL+1))
            fi
          done
          echo "::notice::EXISTING_FILES_CHECK: ok=$OK failed=$FAIL"
