name: Discover Neon storage presign REST endpoint
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          PROJECT_ID="wispy-mud-64641243"
          BRANCH_ID="br-icy-tree-awz49toc"
          BUCKET="biology"
          KEY="test/endpoint-discovery.txt"

          R1=$(curl -s -w "|||HTTP:%{http_code}" -X POST \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID/storage/$BUCKET/objects/presign" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"object_key\":\"$KEY\",\"operation\":\"upload\",\"content_type\":\"text/plain\"}" | tr '\n' ' ')
          echo "::notice::CANDIDATE1: $R1"

          R2=$(curl -s -w "|||HTTP:%{http_code}" -X POST \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID/buckets/$BUCKET/presign" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"object_key\":\"$KEY\",\"operation\":\"upload\",\"content_type\":\"text/plain\"}" | tr '\n' ' ')
          echo "::notice::CANDIDATE2: $R2"
