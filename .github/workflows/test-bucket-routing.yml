name: Cleanup routing test files
on: workflow_dispatch
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for PAIR in "chemistry:CHEMISTRY" "biology:BIOLOGY" "new-files:UNKNOWN_SUBJECT"; do
            BUCKET="${PAIR%%:*}"
            SUBJECT="${PAIR##*:}"
            RESULT=$(curl -s -X DELETE "$SUPABASE_URL/storage/v1/object/$BUCKET/test/routing-check-${SUBJECT}.txt" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
            echo "::notice::DELETED $BUCKET: $RESULT"
          done
