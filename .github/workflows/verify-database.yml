name: Verify new database contents

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - env:
          DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: npx prisma generate
      - env:
          DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: npx tsx prisma/verify-seed.ts
