name: Recover and inspect deleted Neon projects

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/neon-recover-and-inspect.js
