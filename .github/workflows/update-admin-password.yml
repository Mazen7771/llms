name: Update admin password

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - env:
          DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: npx prisma generate
      - env:
          DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
          ADMIN_STUDENT_ID: ${{ secrets.ADMIN_STUDENT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npx tsx prisma/update-admin-password.ts
