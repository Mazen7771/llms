name: Step 6 - real Neon S3 upload test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install @aws-sdk/client-s3 @aws-sdk/s3-request-presigner
      - name: Generate 65MB test file and upload via the real signing code path
        env:
          NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
          NEON_STORAGE_REGION: ${{ secrets.NEON_STORAGE_REGION }}
          NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
          NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
        run: |
          node -e "
          const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');
          const { getSignedUrl } = require('@aws-sdk/s3-request-presigner');
          const fs = require('fs');
          const https = require('https');

          async function main() {
            fs.writeFileSync('/tmp/big.bin', Buffer.alloc(0));
            const stream = fs.createWriteStream('/tmp/big.bin');
            const chunk = Buffer.alloc(1024 * 1024, 'x');
            for (let i = 0; i < 65; i++) stream.write(chunk);
            await new Promise((res) => stream.end(res));
            const size = fs.statSync('/tmp/big.bin').size;
            console.log('Generated file size:', size);

            const s3 = new S3Client({
              endpoint: process.env.NEON_STORAGE_ENDPOINT,
              region: process.env.NEON_STORAGE_REGION,
              forcePathStyle: true,
              credentials: {
                accessKeyId: process.env.NEON_STORAGE_ACCESS_KEY_ID,
                secretAccessKey: process.env.NEON_STORAGE_SECRET_ACCESS_KEY,
              },
            });

            const key = 'test/step6-real-sdk-test.bin';
            const command = new PutObjectCommand({
              Bucket: 'biology',
              Key: key,
              ContentType: 'application/octet-stream',
            });
            const signedUrl = await getSignedUrl(s3, command, { expiresIn: 900 });
            console.log('::notice::SIGNED_URL_HOST=' + new URL(signedUrl).host);

            const fileBuffer = fs.readFileSync('/tmp/big.bin');
            const uploadResult = await new Promise((resolve, reject) => {
              const u = new URL(signedUrl);
              const req = https.request(u, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream', 'Content-Length': fileBuffer.length } }, (res) => {
                let body = '';
                res.on('data', (c) => body += c);
                res.on('end', () => resolve({ status: res.statusCode, body }));
              });
              req.on('error', reject);
              req.write(fileBuffer);
              req.end();
            });
            console.log('::notice::UPLOAD_RESULT status=' + uploadResult.status);

            const publicUrl = process.env.NEON_STORAGE_ENDPOINT + '/biology/' + key;
            const verify = await new Promise((resolve, reject) => {
              https.get(publicUrl, (res) => {
                let len = 0;
                res.on('data', (c) => len += c.length);
                res.on('end', () => resolve({ status: res.statusCode, len }));
              }).on('error', reject);
            });
            console.log('::notice::VERIFY status=' + verify.status + ' downloadedSize=' + verify.len + ' expectedSize=' + size);
          }
          main().catch(e => { console.log('::error::TEST_FAILED: ' + e.message); process.exit(1); });
          "
