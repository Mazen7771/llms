name: Discover Neon storage presign REST endpoint
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          PROJECT_ID="wispy-mud-64641243"
          BRANCH_ID="br-icy-tree-awz49toc"
          BUCKET="biology"
          KEY="test/endpoint-discovery.txt"

          echo "--- Candidate 1: /storage/{bucket}/objects/{key}/presign ---"
          curl -s -w "\nHTTP:%{http_code}\n" -X POST \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID/storage/$BUCKET/objects/presign" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"object_key\":\"$KEY\",\"operation\":\"upload\",\"content_type\":\"text/plain\"}"

          echo "--- Candidate 2: /buckets/{bucket}/presign ---"
          curl -s -w "\nHTTP:%{http_code}\n" -X POST \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID/buckets/$BUCKET/presign" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"object_key\":\"$KEY\",\"operation\":\"upload\",\"content_type\":\"text/plain\"}"
